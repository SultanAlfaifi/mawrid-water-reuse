name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  software:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mawrid-final/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm --prefix mawrid-final ci
      - name: Public-site logic
        run: npm run check
      - name: Local interface and presentation
        run: npm run check:system
      - name: 3D scene and camera
        run: npm run check:scene
      - name: Standard-library server and collector
        run: |
          python3 -B -m unittest discover -s mawrid-system/server -t mawrid-system -p 'test_*.py'
          python3 -B -m unittest discover -s mawrid-system/edge -t mawrid-system -p 'test_*.py'
      - name: Repository and delivered artifacts
        run: npm run check:repo
      - name: Public-site build
        run: npm run build
      - name: Build must match the committed site
        run: git diff --exit-code -- index.html simulator/index.html assets/app
