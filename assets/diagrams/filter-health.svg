<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 470" role="img" aria-labelledby="title desc">
  <title id="title">Condition-based filter health</title>
  <desc id="desc">Diagram distinguishing clogging from adsorption breakthrough and showing safe maintenance decisions.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071d2b"/><stop offset="1" stop-color="#0b3540"/></linearGradient><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#52d6c7"/></marker></defs>
  <rect width="1400" height="470" rx="26" fill="url(#bg)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="55" y="60" fill="#f3fbfa" font-size="27" font-weight="700">Filter health is not a timer</text>
    <text x="55" y="90" fill="#93babc" font-size="15">Hydraulic clogging and adsorption exhaustion are different failure modes and need different evidence.</text>
    <g transform="translate(55 130)">
      <rect width="355" height="250" rx="22" fill="#103c48" stroke="#347b80"/>
      <text x="28" y="42" fill="#6ee0d2" font-size="14" font-weight="700" letter-spacing="2">HYDRAULIC CONDITION</text>
      <text x="28" y="78" fill="#f2fbf9" font-size="25" font-weight="700">Clogging</text>
      <path d="M36 142h267" stroke="#355e64" stroke-width="2"/>
      <path d="M42 137c50-3 81-8 120-5s53-11 76-25 44-22 76-61" fill="none" stroke="#e3b567" stroke-width="5"/>
      <text x="28" y="174" fill="#a9c7c7" font-size="14">Primary evidence</text>
      <text x="28" y="198" fill="#eefaf8" font-size="16" font-weight="700">Differential pressure + flow</text>
      <rect x="27" y="215" width="167" height="26" rx="13" fill="#1d5a5c"/><text x="110" y="233" text-anchor="middle" fill="#b6eee5" font-size="12" font-weight="700">CLEAN / BACKWASH</text>
    </g>
    <g transform="translate(455 130)">
      <rect width="355" height="250" rx="22" fill="#103c48" stroke="#347b80"/>
      <text x="28" y="42" fill="#6ee0d2" font-size="14" font-weight="700" letter-spacing="2">ADSORPTION CONDITION</text>
      <text x="28" y="78" fill="#f2fbf9" font-size="25" font-weight="700">Breakthrough</text>
      <path d="M36 142h267" stroke="#355e64" stroke-width="2"/>
      <path d="M42 139c79 0 123 0 153-4s47-21 61-48 23-31 58-39" fill="none" stroke="#52d6c7" stroke-width="5"/>
      <path d="M210 43v105" stroke="#e3b567" stroke-width="2" stroke-dasharray="5 5"/>
      <text x="28" y="174" fill="#a9c7c7" font-size="14">Primary evidence</text>
      <text x="28" y="198" fill="#eefaf8" font-size="16" font-weight="700">Cout/Cin + bed volumes</text>
      <rect x="27" y="215" width="211" height="26" rx="13" fill="#4a3c28"/><text x="132" y="233" text-anchor="middle" fill="#ffe1a3" font-size="12" font-weight="700">REPLACE / REGENERATE</text>
    </g>
    <g transform="translate(855 130)">
      <rect width="490" height="250" rx="22" fill="#123b42" stroke="#d1ad67"/>
      <text x="28" y="42" fill="#e6c781" font-size="14" font-weight="700" letter-spacing="2">RELEASE DECISION</text>
      <circle cx="63" cy="94" r="24" fill="#1f615f"/><path d="m52 94 8 8 15-19" fill="none" stroke="#a9f1e7" stroke-width="5" stroke-linecap="round"/>
      <text x="101" y="91" fill="#f1fbf9" font-size="18" font-weight="700">All validated conditions met</text>
      <text x="101" y="115" fill="#a9c7c7" font-size="14">Reuse may open on demand</text>
      <circle cx="63" cy="166" r="24" fill="#68442f"/><path d="m52 155 22 22m0-22-22 22" stroke="#ffd29a" stroke-width="5" stroke-linecap="round"/>
      <text x="101" y="163" fill="#f1fbf9" font-size="18" font-weight="700">Bad, missing, or uncertain data</text>
      <text x="101" y="187" fill="#d5bca3" font-size="14">Close valve and divert safely</text>
      <rect x="28" y="211" width="430" height="28" rx="14" fill="#3b3027"/>
      <text x="243" y="230" text-anchor="middle" fill="#ffe3ac" font-size="12" font-weight="700" letter-spacing="1">NO VERIFIED PROCESS STATE → NO REUSE</text>
    </g>
    <path d="M412 255h37M812 255h37" stroke="#52d6c7" stroke-width="3" marker-end="url(#a)"/>
    <text x="55" y="430" fill="#779da0" font-size="13" letter-spacing="1">Prediction may support maintenance planning. It never replaces the validated release limits or laboratory verification.</text>
  </g>
</svg>
