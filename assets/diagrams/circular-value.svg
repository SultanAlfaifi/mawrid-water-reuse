<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
  <title id="title">MAWRID circular value</title>
  <desc id="desc">Two inputs, ablution water and date-palm residue, converge in monitored treatment and non-potable reuse.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071d2b"/><stop offset="1" stop-color="#0b3540"/></linearGradient><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#54d7c8"/></marker></defs>
  <rect width="1400" height="430" rx="26" fill="url(#bg)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="55" y="60" fill="#f3fbfa" font-size="27" font-weight="700">Two underused streams. One measurable pathway.</text>
    <text x="55" y="90" fill="#93babc" font-size="15">Circular value is a hypothesis until water, energy, media, residuals, and end-of-life burdens are measured.</text>
    <g transform="translate(65 145)"><rect width="245" height="160" rx="24" fill="#103d49" stroke="#317b81"/><path d="M78 30c-17 25-35 48-35 68a35 35 0 0 0 70 0c0-20-18-43-35-68Z" fill="#3dd3c5"/><text x="132" y="65" fill="#f0faf8" font-size="19" font-weight="700">ABLUTION</text><text x="132" y="90" fill="#f0faf8" font-size="19" font-weight="700">GREYWATER</text><text x="132" y="124" fill="#a7c7c8" font-size="13">Source-separated</text><text x="132" y="145" fill="#a7c7c8" font-size="13">and characterized</text></g>
    <g transform="translate(65 325)"><text x="122" y="25" text-anchor="middle" fill="#83adaf" font-size="12" font-weight="700" letter-spacing="2">WATER INPUT</text></g>
    <g transform="translate(390 145)"><rect width="245" height="160" rx="24" fill="#3b3528" stroke="#b89351"/><path d="M63 114c13-52 36-75 75-87-6 48-27 79-75 87Z" fill="none" stroke="#d8b76f" stroke-width="6"/><path d="M70 103c19-17 37-34 62-67M88 87l-7-26M101 72l24 1" fill="none" stroke="#d8b76f" stroke-width="4" stroke-linecap="round"/><text x="147" y="66" fill="#fff6e5" font-size="19" font-weight="700">DATE-PALM</text><text x="147" y="91" fill="#fff6e5" font-size="19" font-weight="700">RESIDUES</text><text x="147" y="124" fill="#d6c5a2" font-size="13">Prepared and converted</text><text x="147" y="145" fill="#d6c5a2" font-size="13">into tested biochar</text></g>
    <g transform="translate(390 325)"><text x="122" y="25" text-anchor="middle" fill="#aa9670" font-size="12" font-weight="700" letter-spacing="2">MEDIA INPUT</text></g>
    <g transform="translate(735 125)"><rect width="280" height="200" rx="28" fill="#124d51" stroke="#54d7c8" stroke-width="2"/><circle cx="140" cy="65" r="39" fill="#1a6f70"/><path d="M140 38v54M113 65h54" stroke="#9cece1" stroke-width="6" stroke-linecap="round"/><text x="140" y="126" text-anchor="middle" fill="#f2fbf9" font-size="22" font-weight="700">MONITORED</text><text x="140" y="152" text-anchor="middle" fill="#f2fbf9" font-size="22" font-weight="700">TREATMENT</text><text x="140" y="178" text-anchor="middle" fill="#b8d4d2" font-size="13">Filter · adsorb · disinfect · verify</text></g>
    <g transform="translate(1105 145)"><rect width="245" height="160" rx="24" fill="#12494d" stroke="#d2b16b" stroke-width="2"/><path d="M62 32c-17 25-34 47-34 67a34 34 0 0 0 68 0c0-20-17-42-34-67Z" fill="#42d3c4"/><path d="m49 96 9 9 19-24" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="133" y="67" fill="#fff7e9" font-size="18" font-weight="700">APPROVED</text><text x="133" y="91" fill="#fff7e9" font-size="18" font-weight="700">NON-POTABLE</text><text x="133" y="115" fill="#fff7e9" font-size="18" font-weight="700">USE</text><text x="133" y="143" fill="#d7c9aa" font-size="12">Net offset is metered</text></g>
    <path d="M315 225h69M640 225h89M1020 225h79" stroke="#54d7c8" stroke-width="4" marker-end="url(#ar)"/>
    <path d="M1228 315c-16 77-175 76-255 43" fill="none" stroke="#d2b16b" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#ar)"/>
    <text x="1115" y="390" fill="#bfa672" font-size="12" font-weight="700" letter-spacing="1">MEASURE → LEARN → IMPROVE</text>
  </g>
</svg>
