<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
  <title id="title">MAWRID treatment train</title>
  <desc id="desc">Seven-stage process from source-separated ablution water to approved non-potable use, with fail-safe diversion.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071d2b"/><stop offset="1" stop-color="#0b3540"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#55d8c9"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-opacity=".22"/></filter>
  </defs>
  <rect width="1400" height="430" rx="26" fill="url(#bg)"/>
  <text x="58" y="62" fill="#f3fbfa" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">A multi-barrier path with one release decision</text>
  <text x="58" y="92" fill="#91babc" font-family="Arial, Helvetica, sans-serif" font-size="15">Each stage has a defined job. Sensors support control; laboratory testing validates performance.</text>
  <g font-family="Arial, Helvetica, sans-serif" filter="url(#shadow)">
    <g transform="translate(45 135)"><rect width="155" height="145" rx="18" fill="#103c48" stroke="#2f7d82"/><circle cx="77" cy="44" r="24" fill="#168fb4"/><path d="M77 25c-10 15-18 24-18 35a18 18 0 0 0 36 0c0-11-8-20-18-35Z" fill="#77e2d5"/><text x="77" y="100" fill="#effffc" font-size="16" font-weight="700" text-anchor="middle">SOURCE</text><text x="77" y="122" fill="#a9c7c7" font-size="12" text-anchor="middle">Separated drains</text></g>
    <g transform="translate(235 135)"><rect width="155" height="145" rx="18" fill="#103c48" stroke="#2f7d82"/><path d="M50 26h55l-8 50H58Z" fill="none" stroke="#66d8c9" stroke-width="5"/><path d="M61 42h33M59 54h37M57 66h41" stroke="#66d8c9" stroke-width="3"/><text x="77" y="100" fill="#effffc" font-size="16" font-weight="700" text-anchor="middle">SCREEN</text><text x="77" y="122" fill="#a9c7c7" font-size="12" text-anchor="middle">Coarse protection</text></g>
    <g transform="translate(425 135)"><rect width="155" height="145" rx="18" fill="#103c48" stroke="#2f7d82"/><rect x="47" y="22" width="60" height="61" rx="8" fill="none" stroke="#66d8c9" stroke-width="4"/><path d="M52 63c16-9 33 8 50-2v17H52Z" fill="#2298ad"/><text x="77" y="100" fill="#effffc" font-size="16" font-weight="700" text-anchor="middle">EQUALIZE</text><text x="77" y="122" fill="#a9c7c7" font-size="12" text-anchor="middle">Stabilize flow</text></g>
    <g transform="translate(615 135)"><rect width="155" height="145" rx="18" fill="#103c48" stroke="#2f7d82"/><rect x="45" y="19" width="65" height="66" rx="8" fill="none" stroke="#66d8c9" stroke-width="4"/><path d="M49 41h57M49 53h57M49 66h57" stroke="#d8b66d" stroke-width="8"/><text x="77" y="100" fill="#effffc" font-size="16" font-weight="700" text-anchor="middle">FILTER</text><text x="77" y="122" fill="#a9c7c7" font-size="12" text-anchor="middle">Sand / multimedia</text></g>
    <g transform="translate(805 135)"><rect width="155" height="145" rx="18" fill="#103c48" stroke="#2f7d82"/><rect x="45" y="18" width="65" height="68" rx="8" fill="none" stroke="#66d8c9" stroke-width="4"/><circle cx="60" cy="38" r="7" fill="#be9852"/><circle cx="79" cy="34" r="9" fill="#d2b572"/><circle cx="97" cy="42" r="7" fill="#ad8645"/><circle cx="66" cy="60" r="9" fill="#d2b572"/><circle cx="89" cy="62" r="11" fill="#be9852"/><text x="77" y="100" fill="#effffc" font-size="16" font-weight="700" text-anchor="middle">ADSORB</text><text x="77" y="122" fill="#a9c7c7" font-size="12" text-anchor="middle">Palm biochar</text></g>
    <g transform="translate(995 135)"><rect width="155" height="145" rx="18" fill="#103c48" stroke="#2f7d82"/><path d="M77 18 105 29v22c0 18-12 29-28 36-16-7-28-18-28-36V29Z" fill="none" stroke="#66d8c9" stroke-width="4"/><path d="m64 51 9 9 18-21" fill="none" stroke="#d8b66d" stroke-width="5" stroke-linecap="round"/><text x="77" y="100" fill="#effffc" font-size="16" font-weight="700" text-anchor="middle">DISINFECT</text><text x="77" y="122" fill="#a9c7c7" font-size="12" text-anchor="middle">Validated barrier</text></g>
    <g transform="translate(1185 135)"><rect width="170" height="145" rx="18" fill="#12494d" stroke="#d5b36b" stroke-width="2"/><path d="M85 21c-14 20-28 36-28 51a28 28 0 0 0 56 0c0-15-14-31-28-51Z" fill="#48d6c6"/><path d="m73 65 8 8 17-21" fill="none" stroke="#f7fffd" stroke-width="5" stroke-linecap="round"/><text x="85" y="100" fill="#fff7e8" font-size="16" font-weight="700" text-anchor="middle">APPROVED REUSE</text><text x="85" y="122" fill="#d7caa9" font-size="12" text-anchor="middle">Non-potable only</text></g>
  </g>
  <g stroke="#55d8c9" stroke-width="3" marker-end="url(#arrow)"><path d="M203 207h27"/><path d="M393 207h27"/><path d="M583 207h27"/><path d="M773 207h27"/><path d="M963 207h27"/><path d="M1153 207h27"/></g>
  <path d="M1090 289v50H894" fill="none" stroke="#e3b96c" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <rect x="520" y="323" width="370" height="68" rx="16" fill="#402f28" stroke="#d4a55a"/>
  <text x="705" y="350" text-anchor="middle" fill="#ffe9ba" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">UNVERIFIED STATE → NO REUSE</text>
  <text x="705" y="374" text-anchor="middle" fill="#d7c4a2" font-family="Arial, Helvetica, sans-serif" font-size="13">Reprocess, contain, or route to an approved sewer</text>
</svg>
