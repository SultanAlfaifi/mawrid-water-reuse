<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc"><title id="title">مورد — مياه الوضوء، مورد للري.</title><desc id="desc">MAWRID concept: separated campus ablution water for landscape irrigation.</desc><rect width="1500" height="500" fill="#e9f3ef"/><path d="M70 430H1430" stroke="#b4cfba"/><g transform="translate(85 55) scale(1.5)" fill="none" stroke="#123e35" stroke-width="2.5"><path d="M24 5C19 13 10 21 10 30a14 14 0 0 0 28 0C38 21 29 13 24 5Z"/><path d="M11 29h12a7 7 0 0 1 7 7v6M38 27H27a7 7 0 0 1-7-7V11"/></g><text x="180" y="104" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#123e35" letter-spacing="5">MAWRID</text><g font-family="Arial,sans-serif" fill="#123e35"><text x="75" y="200" font-size="49.5" font-weight="700">Ablution water.</text><text x="75" y="270" font-size="49.5" font-weight="700" fill="#39786a">A resource for irrigation.</text><text x="75" y="335" font-size="18" fill="#64766c">One campus. A defined source. Impact to measure.</text><text x="75" y="463" font-size="13" letter-spacing="2" fill="#64766c">CONCEPT DESIGN / VALIDATION PLANNED</text></g><g transform="translate(1035 110)" fill="none" stroke="#39786a" stroke-width="3"><path d="M100 0C66 54 4 113 4 176a96 96 0 0 0 192 0C196 113 134 54 100 0Z"/><path d="M7 168h87a49 49 0 0 1 49 49v54M192 155h-77a49 49 0 0 1-49-49V43"/></g><text x="1385" y="402" text-anchor="end" direction="rtl" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#123e35">مياه الوضوء، مورد للري.</text></svg>