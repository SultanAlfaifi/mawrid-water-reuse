<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="480" viewBox="0 0 480 480" role="img" aria-labelledby="title desc"><title id="title">مشربية هندسية — مورد</title><desc id="desc">مورد — هوية الحرم المشرق. قالب قابل للتحرير. النصوص مسارات لضمان تشكيل العربية؛ الصور تصورات توضيحية. المقاس النهائي دون نزف طباعي.</desc><defs><pattern id="screen" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse"><g fill="none" stroke="#123e35" stroke-width="1.5"><path d="M50 0 100 50 50 100 0 50ZM0 0H100V100H0ZM25 25H75V75H25ZM50 15 85 50 50 85 15 50Z"/></g></pattern></defs><rect x="0" y="0" width="480" height="480" fill="url(#screen)" opacity="0.12"/></svg>