<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="720" height="720" viewBox="0 0 720 720" role="img" aria-labelledby="title desc"><title id="title">قوس الضوء — مورد</title><desc id="desc">مورد — هوية الحرم المشرق. قالب قابل للتحرير. النصوص مسارات لضمان تشكيل العربية؛ الصور تصورات توضيحية. المقاس النهائي دون نزف طباعي.</desc><defs><pattern id="screen" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse"><g fill="none" stroke="#123e35" stroke-width="1.5"><path d="M50 0 100 50 50 100 0 50ZM0 0H100V100H0ZM25 25H75V75H25ZM50 15 85 50 50 85 15 50Z"/></g></pattern></defs><path d="M115 720V295A245 245 0 0 1 605 295V720" fill="none" stroke="#d9ccba" stroke-width="50" opacity=".18"/><path d="M215 720V305A145 145 0 0 1 505 305V720" fill="none" stroke="#b4cfba" stroke-width="30" opacity=".13"/></svg>